apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: axiomzetasentinel-gateway-validating-webhook
webhooks:
  - name: vaxiomzetasentinelgateways.platform.axiomzetasentinel.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["platform.axiomzetasentinel.io"]
        apiVersions: ["v1alpha1"]
        resources: ["axiomzetasentinelgateways"]
    clientConfig:
      service:
        namespace: axiomzetasentinel-system
        name: axiomzetasentinel-operator-webhook
        path: /validate-platform-axiomzetasentinel-io-v1alpha1-axiomzetasentinelgateway
      caBundle: ""
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiomzetasentinelgateways.platform.axiomzetasentinel.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: axiomzetasentinel-system
          name: axiomzetasentinel-operator-webhook
          path: /convert-platform-axiomzetasentinel-io
        caBundle: ""
