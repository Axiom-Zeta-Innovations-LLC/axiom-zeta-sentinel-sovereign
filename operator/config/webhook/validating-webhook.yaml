apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: axiomdrift-gateway-validating-webhook
webhooks:
  - name: vaxiomdriftgateways.platform.axiomdrift.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["platform.axiomdrift.io"]
        apiVersions: ["v1alpha1"]
        resources: ["axiomdriftgateways"]
    clientConfig:
      service:
        namespace: axiomdrift-system
        name: axiomdrift-operator-webhook
        path: /validate-platform-axiomdrift-io-v1alpha1-axiomdriftgateway
      caBundle: ""
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiomdriftgateways.platform.axiomdrift.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: axiomdrift-system
          name: axiomdrift-operator-webhook
          path: /convert-platform-axiomdrift-io
        caBundle: ""
