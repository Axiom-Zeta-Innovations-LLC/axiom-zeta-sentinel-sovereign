apiVersion: platform.axiomdrift.io/v1alpha1
kind: AxiomDriftGateway
metadata:
  name: axiom-drift-enterprise
spec:
  image: ghcr.io/anthonyrenecastro-create/axiom-drift-sovereign:latest
  replicas: 3
  tenantRuntimeCacheEnabled: false
  auth:
    mode: oidc
    oidcIssuer: https://idp.example.com
    oidcAudience: axiom-drift-sovereign
    oidcJwksUrl: https://idp.example.com/.well-known/jwks.json
    oidc:
      sessionTtlSeconds: 3600
      sessionMaxLifetimeSeconds: 86400
      auditLogPath: /var/log/axiom-drift/auth-audit.jsonl
      auditLogMaxBytes: 10485760
      auditLogBackupCount: 5
    requiredGroups:
      - axiom-drift-users
    groupRoleMap:
      - axiom-drift-admins:admin
      - axiom-drift-analysts:analyst
  highAvailability:
    enabled: true
    minAvailable: 2
  airgap:
    enabled: true
    allowOutboundNetwork: false
    allowedHosts:
      - idp.example.com
      - opa.svc.cluster.local
  policy:
    mode: opa
    defaultDecision: deny
    decisionLogPath: /var/log/axiom-drift/policy-decisions.jsonl
    bundleConfigMapName: axiom-drift-policy-bundle
