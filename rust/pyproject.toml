[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "axiom-zeta-sentinel-core"
version = "0.1.0"
description = "Rust core for axiom-zeta-sentinel drift prevention gateway"
requires-python = ">=3.10"

[tool.maturin]
module-name = "axiom_zeta_sentinel_core"
features = ["pyo3/extension-module"]
