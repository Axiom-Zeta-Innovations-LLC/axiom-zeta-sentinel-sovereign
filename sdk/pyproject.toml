[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-zeta-sentinel-sdk"
version = "0.1.0"
description = "Python SDK for Axiom Zeta Sentinel Sovereign Gateway"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom_zeta_sentinel_sdk*"]
