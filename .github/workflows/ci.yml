name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install fastapi==0.111.0 "uvicorn[standard]==0.30.1" pydantic==2.8.2 python-multipart==0.0.9 pytest==8.3.2 requests==2.32.3 httpx "psycopg[binary]>=3.2.1" "PyJWT[crypto]>=2.9.0" "redis>=5.1.0" "kubernetes>=30.1.0"
      - name: Run tests (mocked Rust core)
        env:
          TEAM_STORE_BACKEND: memory
        run: python -m pytest tests/ -q
