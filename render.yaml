services:
  - type: web
    name: axiom-zeta-sentinel-sovereign
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: GATEWAY_API_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TEAM_STORE_BACKEND
        value: memory
      - key: AUTH_MODE
        value: api_key
